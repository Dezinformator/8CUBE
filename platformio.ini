[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit GC9A01A
    bblanchon/ArduinoJson@^7.0.4
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1